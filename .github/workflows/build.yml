name: Build standalone app

# Собирает готовые к запуску приложения для Windows и macOS - без установки Python и
# библиотек пользователем. Запускается вручную (Actions -> Build standalone app -> Run
# workflow) или автоматически при пуше тега вида v1.0.0 - во втором случае собранные файлы
# дополнительно прикрепляются к GitHub Release с этим тегом.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: TravelExpert-windows.zip
          - os: macos-latest
            asset_name: TravelExpert-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name TravelExpert MyProgram/main.py
          Compress-Archive -Path dist/TravelExpert.exe -DestinationPath ${{ matrix.asset_name }}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name TravelExpert MyProgram/main.py
          cd dist && zip -r ../${{ matrix.asset_name }} TravelExpert.app && cd ..

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
